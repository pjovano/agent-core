name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONIOENCODING: utf-8
  UV_PYTHON: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUFF_VERSION: 0.16.8
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv venv
      - run: uv pip install "ruff==${RUFF_VERSION}"
      - run: uv run --no-project ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv venv
      - run: uv run --no-project python -m unittest discover -s tests

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv venv
      - name: Report the control-plane audit's lint rows; fail only if the engine cannot run
        run: |
          uv run --no-project python .claude/skills/control-plane-audit/scripts/audit.py lint > audit.json
          jq '.' audit.json

  publish-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks, verified against its published checksum
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Fail if the tree or any commit carries a secret
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --exit-code 1 .
          "$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact --exit-code 1 .

  split-core:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, audit, publish-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: split-core
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Push core/ alone to the branch core, without force
        run: |
          split="$(git subtree split --prefix core HEAD)"
          echo "core/ of $(git rev-parse HEAD) splits to $split"
          git push origin "$split:refs/heads/core"
